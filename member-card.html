<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kartu Member - Miaw Petshop</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="../css/member.css" />
</head>
<body>
  <div id="navbar"></div>

  <section class="page-header">
    <div class="container">
      <h1>💳 Kartu Member Digital</h1>
      <p>Simpan kartu ini sebagai tanda keanggotaan Anda</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="member-card-wrap">
        <div class="member-card">
          <div class="member-card-header">
            <div class="member-card-brand">
              <span class="brand-emoji">🐾</span>Miaw Petshop
            </div>
            <div class="member-card-label">Member Card</div>
          </div>

          <div class="member-card-avatar">😺</div>
          <h3 class="member-card-name" id="cardName">-</h3>
          <div class="member-card-number" id="cardNumber">-</div>

          <div class="member-card-info">
            <div>
              <div class="label">Email</div>
              <div class="value" id="cardEmail">-</div>
            </div>
            <div>
              <div class="label">Bergabung Sejak</div>
              <div class="value" id="cardJoin">-</div>
            </div>
          </div>
        </div>
      </div>

      <div style="text-align: center; margin-top: 24px;">
        <a href="profile.html" class="btn btn-outline">Lihat Profil</a>
        <a href="orders.html" class="btn btn-primary">Riwayat Pesanan</a>
      </div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="../js/script.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/member.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      injectLayout('member-card');
      if (requireMemberLogin()) {
        renderMemberCard();
      }
    });
  </script>
</body>
</html>
