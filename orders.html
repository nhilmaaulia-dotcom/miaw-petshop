<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Riwayat Pesanan - Miaw Petshop</title>
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .order-card { background: white; border-radius: var(--radius-md); padding: 22px; box-shadow: var(--shadow-soft); margin-bottom: 18px; border-left: 4px solid var(--pink-deep); }
    .order-header { display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 8px; padding-bottom: 12px; border-bottom: 1px dashed var(--cream-dark); margin-bottom: 12px; }
    .order-id { font-family: 'DM Sans', sans-serif; font-weight: 700; color: var(--pink-deep); font-size: 1.05rem; }
    .order-date { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }
    .order-items { margin-bottom: 14px; }
    .order-item-row { display: flex; align-items: center; gap: 10px; padding: 6px 0; font-size: 0.92rem; }
    .oi-emoji { font-size: 1.4rem; width: 30px; }
    .oi-name { flex: 1; }
    .oi-qty { color: var(--text-muted); font-size: 0.85rem; }
    .order-recipient { background: var(--cream); padding: 12px; border-radius: var(--radius-sm); font-size: 0.88rem; margin-bottom: 14px; line-height: 1.6; }
    .order-footer { display: flex; justify-content: space-between; align-items: center; padding-top: 12px; border-top: 1px dashed var(--cream-dark); flex-wrap: wrap; gap: 8px; font-size: 0.92rem; }
    .order-total { font-weight: 700; color: var(--pink-deep); font-size: 1.05rem; }
  </style>
</head>
<body>
  <div id="navbar"></div>

  <section class="page-header">
    <div class="container">
      <h1>📦 Riwayat Pesanan</h1>
      <p>Pantau semua pesanan yang pernah Anda buat</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div id="ordersContainer"></div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="../js/script.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/orders.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      injectLayout('orders');
      if (requireMemberLogin()) {
        renderOrders();
      }
    });
  </script>
</body>
</html>
