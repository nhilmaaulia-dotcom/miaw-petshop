<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Member - Miaw Petshop</title>
  <link rel="stylesheet" href="style.css" />
  <style>
    body {
      background-color: #fff5f8;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
    }
    .login-container {
      min-height: 85vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .login-card {
      background: #ffffff;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 8px 25px rgba(214, 51, 132, 0.1);
      width: 100%;
      max-width: 420px;
      box-sizing: border-box;
    }
    .login-header {
      text-align: center;
      margin-bottom: 25px;
    }
    .login-header h2 {
      color: #333;
      margin: 10px 0 5px 0;
      font-size: 24px;
    }
    .login-header p {
      color: #666;
      font-size: 14px;
      margin: 0;
    }
    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      color: #444;
      font-size: 13px;
    }
    .form-group input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 14px;
      box-sizing: border-box;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-group input:focus {
      border-color: #d63384;
      box-shadow: 0 0 0 3px rgba(214, 51, 132, 0.15);
      outline: none;
    }
    .btn-submit {
      width: 100%;
      background: #d63384;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }
    .btn-submit:hover {
      background: #c22575;
    }
    .login-footer {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }
    .login-footer a {
      color: #d63384;
      text-decoration: none;
      font-weight: 600;
    }
    .login-footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <!-- Navbar -->
  <div id="navbar"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <span style="font-size: 36px;">🐱🐾</span>
        <h2>Selamat Datang</h2>
        <p>Masuk ke akun member Miaw Petshop Anda</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" placeholder="email@contoh.com" required>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" placeholder="Masukkan password Anda" required>
        </div>

        <button type="submit" class="btn-submit">Masuk</button>
      </form>

      <div class="login-footer">
        Belum punya akun? <a href="member-register.html">Daftar sekarang →</a>
      </div>
    </div>
  </div>

  <!-- Footer -->
  <div id="footer"></div>

  <!-- Script Pendukung -->
  <script src="script.js"></script>
</body>
</html>
